openapi: 3.0.3
info:
  title: E-Commerce API
  version: 1.0.0
  description: REST API for authentication, products, categories, cart, orders, and payments.
servers:
  - url: http://127.0.0.1:8080/api
    description: Docker Apache API
  - url: http://ecommerce.localhost/api
    description: Local Apache vhost API
  - url: http://127.0.0.1:8000/api
    description: Local Laravel API
tags:
  - name: Authentication
  - name: Categories
  - name: Products
  - name: Cart
  - name: Orders
  - name: Payments
security:
  - bearerAuth: []
paths:
  /register:
    post:
      tags: [Authentication]
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /login:
    post:
      tags: [Authentication]
      summary: Login and create an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /profile:
    get:
      tags: [Authentication]
      summary: Get the authenticated user profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /logout:
    post:
      tags: [Authentication]
      summary: Revoke the current API token
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /categories:
    get:
      tags: [Categories]
      summary: List categories
      security: []
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryCollection'
    post:
      tags: [Categories]
      summary: Create a category
      description: Admin users only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /categories/{category}:
    get:
      tags: [Categories]
      summary: Show a category
      security: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResource'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Categories]
      summary: Update a category
      description: Admin users only.
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResource'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Categories]
      summary: Delete a category
      description: Admin users only.
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '204':
          description: Category deleted
        '403':
          $ref: '#/components/responses/Forbidden'
  /products:
    get:
      tags: [Products]
      summary: List products
      security: []
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          schema:
            type: string
        - name: category_id
          in: query
          schema:
            type: integer
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCollection'
    post:
      tags: [Products]
      summary: Create a product
      description: Admin users only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResource'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /products/{product}:
    get:
      tags: [Products]
      summary: Show a product
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResource'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      summary: Update a product
      description: Admin users only.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResource'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Products]
      summary: Delete a product
      description: Admin users only.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: Product deleted
        '403':
          $ref: '#/components/responses/Forbidden'
  /cart:
    get:
      tags: [Cart]
      summary: List current user's cart items
      responses:
        '200':
          description: Cart items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartCollection'
    post:
      tags: [Cart]
      summary: Add or replace a cart item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
      responses:
        '200':
          description: Cart item saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemResource'
        '422':
          $ref: '#/components/responses/ValidationError'
  /cart/{cartItem}:
    get:
      tags: [Cart]
      summary: Show a cart item
      parameters:
        - $ref: '#/components/parameters/CartItemId'
      responses:
        '200':
          description: Cart item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemResource'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Cart]
      summary: Update cart item quantity
      parameters:
        - $ref: '#/components/parameters/CartItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  example: 2
      responses:
        '200':
          description: Cart item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemResource'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Cart]
      summary: Remove a cart item
      parameters:
        - $ref: '#/components/parameters/CartItemId'
      responses:
        '204':
          description: Cart item removed
        '403':
          $ref: '#/components/responses/Forbidden'
  /orders:
    get:
      tags: [Orders]
      summary: List current user's orders
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCollection'
    post:
      tags: [Orders]
      summary: Create an order from the current cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResource'
        '422':
          $ref: '#/components/responses/ValidationError'
  /orders/{order}:
    get:
      tags: [Orders]
      summary: Show an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResource'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Orders]
      summary: Update order status
      description: Admin users only.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusRequest'
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResource'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Orders]
      summary: Cancel an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /payments:
    get:
      tags: [Payments]
      summary: List payments
      description: Admin users only.
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCollection'
        '403':
          $ref: '#/components/responses/Forbidden'
  /payments/{payment}:
    get:
      tags: [Payments]
      summary: Show a payment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResource'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
    CategoryId:
      name: category
      in: path
      required: true
      schema:
        type: integer
    ProductId:
      name: product
      in: path
      required: true
      schema:
        type: integer
    CartItemId:
      name: cartItem
      in: path
      required: true
      schema:
        type: integer
    OrderId:
      name: order
      in: path
      required: true
      schema:
        type: integer
    PaymentId:
      name: payment
      in: path
      required: true
      schema:
        type: integer
  responses:
    Unauthenticated:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: User is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          example: Customer User
        email:
          type: string
          format: email
          example: customer@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: password
        password_confirmation:
          type: string
          format: password
          example: password
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        password:
          type: string
          format: password
          example: password
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          example: 1|sanctum-token-value
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Customer User
        email:
          type: string
          format: email
          example: customer@example.com
        is_admin:
          type: boolean
          example: false
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Electronics
        slug:
          type: string
          nullable: true
          example: electronics
        description:
          type: string
          nullable: true
          example: Phones, audio, and accessories.
        is_active:
          type: boolean
          example: true
    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Electronics
        slug:
          type: string
          example: electronics
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
          example: true
        products_count:
          type: integer
          nullable: true
          example: 2
    CategoryResource:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Category'
    CategoryCollection:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Category'
    ProductRequest:
      type: object
      required: [category_id, name, price, stock]
      properties:
        category_id:
          type: integer
          example: 1
        name:
          type: string
          example: Wireless Headphones
        slug:
          type: string
          nullable: true
          example: wireless-headphones
        description:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
          example: https://example.com/product.jpg
        price:
          type: number
          format: float
          minimum: 0
          example: 89.99
        stock:
          type: integer
          minimum: 0
          example: 30
        is_active:
          type: boolean
          example: true
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        category_id:
          type: integer
          example: 1
        category:
          $ref: '#/components/schemas/Category'
        name:
          type: string
          example: Wireless Headphones
        slug:
          type: string
          example: wireless-headphones
        description:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        price:
          type: string
          example: '89.99'
        stock:
          type: integer
          example: 30
        is_active:
          type: boolean
          example: true
    ProductResource:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Product'
    ProductCollection:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Product'
    CartItemRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: integer
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 2
    CartItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 1
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer
          example: 2
        line_total:
          type: number
          example: 179.98
    CartItemResource:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CartItem'
    CartCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
    CheckoutRequest:
      type: object
      required: [payment_method, shipping_name, shipping_phone, shipping_address, shipping_city]
      properties:
        payment_method:
          type: string
          enum: [cash_on_delivery, card, payment_gateway]
          example: cash_on_delivery
        shipping_name:
          type: string
          example: Customer User
        shipping_phone:
          type: string
          example: '+201000000000'
        shipping_address:
          type: string
          example: 10 Main Street
        shipping_city:
          type: string
          example: Cairo
        shipping_country:
          type: string
          example: Egypt
        notes:
          type: string
          nullable: true
    OrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
          example: processing
        payment_status:
          type: string
          enum: [pending, paid, failed, refunded]
          example: paid
    Order:
      type: object
      properties:
        id:
          type: integer
          example: 1
        order_number:
          type: string
          example: ORD-20260807-ABCDEFGH
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
        subtotal:
          type: string
          example: '179.98'
        shipping_total:
          type: string
          example: '0.00'
        total:
          type: string
          example: '179.98'
        payment_method:
          type: string
          example: cash_on_delivery
        payment_status:
          type: string
          example: pending
        shipping:
          type: object
          properties:
            name:
              type: string
            phone:
              type: string
            address:
              type: string
            city:
              type: string
            country:
              type: string
        notes:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        payment:
          $ref: '#/components/schemas/Payment'
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        product_id:
          type: integer
        product_name:
          type: string
        unit_price:
          type: string
        quantity:
          type: integer
        total:
          type: string
    OrderResource:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Order'
    OrderCollection:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Order'
    Payment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        order_id:
          type: integer
          example: 1
        method:
          type: string
          example: cash_on_delivery
        status:
          type: string
          example: pending
        amount:
          type: string
          example: '179.98'
        transaction_id:
          type: string
          nullable: true
    PaymentResource:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Payment'
    PaymentCollection:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Payment'
    PaginatedResponse:
      type: object
      properties:
        links:
          type: object
        meta:
          type: object
    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Done.
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Unauthenticated.
    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
